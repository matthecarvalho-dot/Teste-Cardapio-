<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .glass-header { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="pb-28">

    <header class="glass-header sticky top-0 z-50 px-5 py-4 flex justify-between items-center">
        <div class="font-extrabold text-sm text-white flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-red-600 to-amber-500 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-store text-white text-xs"></i>
            </div>
            <span id="header-store-name" class="text-base">Cardápio Digital</span>
        </div>
        <div class="flex items-center gap-5 text-xs font-bold text-slate-400">
            <button onclick="openCart()" class="flex flex-col items-center hover:text-red-500 transition relative"><i class="fa-solid fa-bag-shopping mb-1 text-lg"></i> Sacola</button>
            <button onclick="openClientOrdersModal()" class="flex flex-col items-center hover:text-white transition text-slate-300"><i class="fa-solid fa-clock-rotate-left mb-1 text-lg"></i> Meus Pedidos</button>
        </div>
    </header>

    <div class="w-full">
        <div id="store-banner" class="w-full h-56 md:h-72 bg-slate-800 bg-cover bg-center relative">
            <div class="absolute inset-0 bg-gradient-to-t from-[#020617] via-[#020617]/60 to-transparent"></div>
        </div>

        <div class="max-w-5xl mx-auto px-4 md:px-8 relative -mt-20">
            <div class="flex flex-col md:flex-row md:items-end gap-5 mb-8">
                <img id="store-logo-img" src="" alt="Logo" class="w-28 h-28 md:w-36 md:h-36 rounded-3xl border-4 border-[#020617] shadow-2xl object-cover bg-slate-900 shrink-0">
                <div class="pb-2">
                    <h1 id="store-title" class="text-3xl md:text-5xl font-extrabold text-white tracking-tight mb-2">A carregar...</h1>
                    <span id="store-hours" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900/80 border border-slate-800 text-xs font-bold text-amber-400"><i class="fa-solid fa-clock"></i> <span></span></span>
                </div>
            </div>

            <div class="relative mb-8">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-4 text-slate-400 text-lg"></i>
                <input type="text" id="search-input" onkeyup="searchMenu(this.value)" placeholder="O que deseja pedir hoje?" class="w-full bg-slate-900 border border-slate-800 rounded-full pl-14 pr-5 py-4 text-sm text-white focus:border-red-500 outline-none shadow-lg">
            </div>

            <div class="flex gap-3 overflow-x-auto pb-4 mb-6 scrollbar-hide" id="categories-container"></div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5" id="products-container"></div>
        </div>
    </div>

    <!-- MODAL DE PEDIDOS DO CLIENTE -->
    <div id="client-orders-modal" class="fixed inset-0 bg-[#020617]/80 backdrop-blur-md z-50 hidden items-center justify-center p-4">
        <div class="glass-card rounded-3xl p-6 md:p-8 max-w-lg w-full max-h-[85vh] flex flex-col shadow-2xl relative">
            <button onclick="document.getElementById('client-orders-modal').style.display='none'" class="absolute top-5 right-5 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-xl font-extrabold text-white mb-4">Acompanhar Meus Pedidos</h3>
            <div id="client-orders-list" class="space-y-3 overflow-y-auto flex-1 pr-1"></div>
        </div>
    </div>

    <div id="cart-floater" class="fixed bottom-6 left-0 right-0 px-4 z-40 hidden pointer-events-none">
        <div class="max-w-2xl mx-auto pointer-events-auto">
            <button onclick="openCart()" class="w-full bg-red-600 hover:bg-red-700 text-white p-4 rounded-full flex justify-between items-center font-bold shadow-2xl transition">
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 w-8 h-8 rounded-full flex items-center justify-center text-xs" id="cart-count">0</div>
                    <span>Ver Sacola</span>
                </div>
                <span class="text-lg">R$ <span id="cart-total-float">0.00</span></span>
            </button>
        </div>
    </div>

    <div id="product-modal" class="fixed inset-0 bg-[#020617]/80 backdrop-blur-md z-50 hidden items-end md:items-center justify-center sm:p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-t-3xl md:rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl">
            <div class="relative h-64"><img id="modal-img" src="" class="w-full h-full object-cover"><button onclick="closeProductModal()" class="absolute top-4 right-4 w-10 h-10 bg-black/50 text-white rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="p-6 md:p-8">
                <h2 id="modal-title" class="text-2xl font-black mb-2 text-white"></h2>
                <p id="modal-desc" class="text-sm text-slate-400 mb-6"></p>
                <textarea id="modal-notes" placeholder="Observações (ex: tirar cebola)" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm text-white mb-6 outline-none" rows="2"></textarea>
                <div class="flex gap-4">
                    <div class="flex items-center justify-between w-32 bg-slate-950 p-2 rounded-2xl border border-slate-800">
                        <button onclick="changeQty(-1)" class="w-10 h-10 text-slate-400"><i class="fa-solid fa-minus"></i></button>
                        <span id="modal-qty" class="font-bold text-white text-lg">1</span>
                        <button onclick="changeQty(1)" class="w-10 h-10 text-red-500"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <button onclick="addToCart()" class="flex-1 bg-red-600 hover:bg-red-700 text-white rounded-2xl font-bold text-lg">Adicionar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-[#020617]/80 backdrop-blur-md z-50 hidden items-end md:items-center justify-center sm:p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-t-3xl md:rounded-3xl max-w-lg w-full max-h-[90vh] flex flex-col shadow-2xl">
            <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-900 rounded-t-3xl">
                <h2 class="font-black text-xl text-white">A Sua Sacola</h2>
                <button onclick="closeCart()" class="w-8 h-8 bg-slate-800 text-slate-400 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 space-y-6">
                <div id="cart-items" class="space-y-4"></div>
                <form id="checkout-form" class="space-y-4 pt-6 border-t border-slate-800">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest">Informações de Entrega & Pagamento</h3>
                    <input type="text" id="c-name" required placeholder="Seu Nome" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-white outline-none">
                    <input type="tel" id="c-phone" required placeholder="Seu WhatsApp" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-white outline-none">
                    
                    <div class="flex gap-3 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
                        <button type="button" id="btn-delivery" onclick="setDelivery('delivery')" class="flex-1 py-3 rounded-xl text-sm font-bold bg-slate-800 text-white">Entregar</button>
                        <button type="button" id="btn-pickup" onclick="setDelivery('pickup')" class="flex-1 py-3 rounded-xl text-sm font-bold text-slate-400">Retirar</button>
                    </div>

                    <input type="text" id="c-address" placeholder="Morada Completa e Bairro" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-white outline-none">

                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-2">Forma de Pagamento</label>
                        <select id="c-payment" onchange="document.getElementById('change-box').style.display = this.value === 'Dinheiro' ? 'block' : 'none';" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-white outline-none">
                            <option value="Pix">Pix</option>
                            <option value="Cartão de Crédito/Débito">Cartão (Na Entrega)</option>
                            <option value="Dinheiro">Dinheiro</option>
                        </select>
                    </div>

                    <div id="change-box" class="hidden">
                        <input type="text" id="c-change" placeholder="Troco para quanto? (Ex: R$ 50,00)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-white outline-none">
                    </div>

                    <div id="scheduling-box" class="hidden bg-amber-500/10 p-5 rounded-2xl border border-amber-500/20 space-y-3">
                        <label class="text-amber-400 text-sm font-bold flex items-center gap-2"><i class="fa-regular fa-calendar-days"></i> Data da Encomenda</label>
                        <div class="flex gap-3">
                            <input type="date" id="c-date" class="w-1/2 bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white">
                            <input type="time" id="c-time" class="w-1/2 bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white">
                        </div>
                    </div>
                </form>
            </div>
            <div class="p-6 border-t border-slate-800 bg-slate-950 rounded-b-3xl">
                <div class="flex justify-between text-slate-400 text-sm mb-2 font-medium"><span>Subtotal</span> <span id="checkout-subtotal">R$ 0.00</span></div>
                <div class="flex justify-between text-slate-400 text-sm mb-4 font-medium"><span>Taxa de Entrega</span> <span id="checkout-fee">R$ 5.00</span></div>
                <button onclick="sendOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-bold flex justify-center items-center gap-3 shadow-lg text-lg">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Enviar Pedido (R$ <span id="checkout-total">0.00</span>)
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWzFIaSbT-au2oz7_bEgxGsABi5TjDrig",
            authDomain: "cardapio-5fd4a.firebaseapp.com",
            projectId: "cardapio-5fd4a",
            storageBucket: "cardapio-5fd4a.firebasestorage.app",
            messagingSenderId: "774670757984",
            appId: "1:774670757984:web:fc395973740044ab079305"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let stores = [], products = [], orders = [];
        const urlParams = new URLSearchParams(window.location.search);
        const currentStoreIdFromURL = urlParams.get('store');
        let currentStore = null;
        let cart = [], deliveryMode = 'delivery', activeProduct = null, activeQty = 1, currentCategory = 'Pizzas';

        window.loadDatabase = async function() {
            try {
                const storesSnap = await getDocs(collection(db, "stores"));
                stores = storesSnap.docs.map(d => ({ docId: d.id, ...d.data() }));

                const prodsSnap = await getDocs(collection(db, "products"));
                products = prodsSnap.docs.map(d => ({ docId: d.id, ...d.data() }));

                const ordersSnap = await getDocs(collection(db, "orders"));
                orders = ordersSnap.docs.map(d => ({ docId: d.id, ...d.data() }));

                currentStore = currentStoreIdFromURL ? (stores.find(s => s.id === currentStoreIdFromURL) || stores[0]) : stores[0];

                if (currentStore && currentStore.status === 'suspended') {
                    document.body.innerHTML = `<div class="min-h-screen bg-[#020617] flex flex-col items-center justify-center p-6 text-center"><h1 class="text-2xl font-black text-white mb-2">Loja Temporariamente Indisponível</h1><p class="text-slate-400 text-sm">Este estabelecimento encontra-se com pendências administrativas.</p></div>`;
                    return;
                }

                if(currentStore) {
                    document.getElementById('header-store-name').innerText = currentStore.name;
                    document.getElementById('store-title').innerText = currentStore.name;
                    document.getElementById('store-hours').querySelector('span').innerText = `Aberto: ${currentStore.hours || '18:00 - 23:30'}`;
                    document.getElementById('store-logo-img').src = currentStore.logo;
                    document.getElementById('store-banner').style.backgroundImage = `url('${currentStore.cover}')`;
                    renderCategories(); renderProducts();
                }
            } catch (err) { console.error(err); }
        };

        window.openClientOrdersModal = function() {
            if(!currentStore) return;
            const storeOrders = orders.filter(o => o.storeId === currentStore.id);
            const container = document.getElementById('client-orders-list');
            container.innerHTML = storeOrders.length === 0 ? `<p class="text-sm text-slate-500 text-center py-4">Nenhum pedido recente.</p>` : storeOrders.reverse().map(o => `
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                    <div><span class="text-xs text-slate-500 font-bold">#${o.orderId.toString().slice(-4)} • ${o.customer}</span><div class="text-sm font-black text-white mt-0.5">R$ ${o.total.toFixed(2)}</div></div>
                    <span class="px-3 py-1 rounded-full text-xs font-bold ${o.status === 'Concluído' ? 'bg-green-500/10 text-green-400' : 'bg-amber-500/10 text-amber-400'}">${o.status}</span>
                </div>
            `).join('');
            document.getElementById('client-orders-modal').style.display = 'flex';
        }

        function renderCategories() {
            const storeProds = products.filter(p => p.storeId === currentStore.id);
            const cats = [...new Set(storeProds.map(p => p.category))];
            if(cats.length > 0 && !cats.includes(currentCategory)) currentCategory = cats[0];
            document.getElementById('categories-container').innerHTML = cats.map(cat => `
                <button onclick="filterCategory('${cat}')" class="px-6 py-2.5 rounded-full text-sm font-bold whitespace-nowrap transition border ${currentCategory === cat ? 'bg-white text-slate-950 border-white shadow-lg' : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-800'}">${cat}</button>
            `).join('');
        }

        window.filterCategory = function(cat) { currentCategory = cat; document.getElementById('search-input').value = ''; renderCategories(); renderProducts(); }
        window.searchMenu = function(query) { renderProducts(query); }

        function renderProducts(searchQuery = '') {
            const storeProds = products.filter(p => p.storeId === currentStore.id);
            let filtered = searchQuery ? storeProds.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase())) : storeProds.filter(p => p.category === currentCategory);
            document.getElementById('products-container').innerHTML = filtered.map(p => `
                <div onclick="openProduct('${p.docId}')" class="glass-card rounded-2xl p-4 md:p-5 flex gap-4 cursor-pointer hover:border-red-500/50 transition-all group ${!p.available ? 'opacity-40' : ''}">
                    <div class="flex-1 flex flex-col justify-between">
                        <div><h3 class="font-bold text-white mb-2 text-base md:text-lg">${p.name}</h3><p class="text-xs md:text-sm text-slate-400 line-clamp-2">${p.desc}</p></div>
                        <div class="mt-4"><span class="font-black text-green-400 text-lg">R$ ${p.price.toFixed(2)}</span></div>
                    </div>
                    <div class="relative w-32 h-32 md:w-36 md:h-36 shrink-0">
                        <img src="${p.img}" class="w-full h-full rounded-xl object-cover border border-slate-700">
                        <button class="absolute -bottom-3 -right-3 bg-red-600 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>
            `).join('');
        }

        window.openProduct = function(docId) {
            activeProduct = products.find(p => p.docId === docId);
            if (!activeProduct.available) return alert('Produto indisponível.');
            activeQty = 1;
            document.getElementById('modal-img').src = activeProduct.img;
            document.getElementById('modal-title').innerText = activeProduct.name;
            document.getElementById('modal-desc').innerText = activeProduct.desc;
            document.getElementById('modal-qty').innerText = activeQty;
            document.getElementById('modal-notes').value = '';
            document.getElementById('product-modal').style.display = 'flex';
        }

        window.closeProductModal = function() { document.getElementById('product-modal').style.display = 'none'; }
        window.changeQty = function(d) { activeQty = Math.max(1, activeQty + d); document.getElementById('modal-qty').innerText = activeQty; }
        window.addToCart = function() { cart.push({ product: activeProduct, qty: activeQty, notes: document.getElementById('modal-notes').value }); closeProductModal(); updateCartUI(); }

        function updateCartUI() {
            const floater = document.getElementById('cart-floater');
            document.getElementById('scheduling-box').style.display = cart.some(i => i.product.category.includes('Encomendas')) ? 'block' : 'none';
            if (cart.length > 0) {
                floater.style.display = 'block';
                document.getElementById('cart-count').innerText = cart.reduce((a,b)=>a+b.qty,0);
                document.getElementById('cart-total-float').innerText = cart.reduce((a, b) => a + (b.product.price * b.qty), 0).toFixed(2);
            } else { floater.style.display = 'none'; closeCart(); }
            renderCartModal();
        }

        window.openCart = function() { document.getElementById('cart-modal').style.display = 'flex'; }
        window.closeCart = function() { document.getElementById('cart-modal').style.display = 'none'; }

        function renderCartModal() {
            document.getElementById('cart-items').innerHTML = cart.map((item, i) => `
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                    <div><h4 class="font-bold text-sm text-white">${item.qty}x ${item.product.name}</h4><span class="text-green-400 text-sm font-black">R$ ${(item.product.price * item.qty).toFixed(2)}</span></div>
                    <button onclick="cart.splice(${i},1); updateCartUI();" class="text-slate-500 hover:text-red-500 p-2"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
            const sub = cart.reduce((a, b) => a + (b.product.price * b.qty), 0);
            const fee = deliveryMode === 'delivery' ? (currentStore.deliveryFee || 5.00) : 0;
            document.getElementById('checkout-subtotal').innerText = `R$ ${sub.toFixed(2)}`;
            document.getElementById('checkout-fee').innerText = `R$ ${fee.toFixed(2)}`;
            document.getElementById('checkout-total').innerText = (sub + fee).toFixed(2);
        }

        window.setDelivery = function(mode) {
            deliveryMode = mode;
            document.getElementById('btn-delivery').className = mode === 'delivery' ? 'flex-1 py-3 rounded-xl text-sm font-bold bg-slate-800 text-white' : 'flex-1 py-3 rounded-xl text-sm font-bold text-slate-400';
            document.getElementById('btn-pickup').className = mode === 'pickup' ? 'flex-1 py-3 rounded-xl text-sm font-bold bg-slate-800 text-white' : 'flex-1 py-3 rounded-xl text-sm font-bold text-slate-400';
            document.getElementById('c-address').style.display = mode === 'delivery' ? 'block' : 'none';
            renderCartModal();
        }

        window.sendOrder = async function() {
            const name = document.getElementById('c-name').value, phone = document.getElementById('c-phone').value, address = document.getElementById('c-address').value;
            const payment = document.getElementById('c-payment').value;
            const change = document.getElementById('c-change').value;
            if (!name || !phone) return alert('Preencha nome e WhatsApp!');
            const sub = cart.reduce((a, b) => a + (b.product.price * b.qty), 0), total = sub + (deliveryMode === 'delivery' ? (currentStore.deliveryFee || 5.00) : 0);

            let text = `*🍕 NOVO PEDIDO - ${currentStore.name.toUpperCase()}*\n👤 *Cliente:* ${name}\n📞 *Tel:* ${phone}\n💳 *Pagamento:* ${payment}${payment==='Dinheiro' && change ? ' (Troco para: '+change+')':''}\n📦 *Tipo:* ${deliveryMode === 'delivery' ? 'Entrega\n📍 *Morada:* '+address : 'Retirada'}\n`;
            if (cart.some(i => i.product.category.includes('Encomendas'))) text += `📅 *AGENDAMENTO:* ${document.getElementById('c-date').value} às ${document.getElementById('c-time').value}\n`;
            text += `\n*ITENS:*\n` + cart.map(i => `• ${i.qty}x ${i.product.name} (R$ ${(i.product.price * i.qty).toFixed(2)})`).join('\n') + `\n\n💳 *Total:* *R$ ${total.toFixed(2)}*`;

            const newOrder = { orderId: Date.now(), storeId: currentStore.id, customer: name, total, status: 'Pendente', items: `${cart.length} itens`, date: new Date().toISOString() };
            await addDoc(collection(db, "orders"), newOrder);
            window.open(`https://wa.me/${currentStore.phone.replace(/\D/g, '')}?text=${encodeURIComponent(text)}`, '_blank');
            cart = []; closeCart(); updateCartUI();
        }

        loadDatabase();
    </script>
</body>
</html>
