<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS - Cardápio Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        .glass-header { background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="pb-28">

    <header class="glass-header sticky top-0 z-50 px-5 py-4 flex justify-between items-center">
        <div class="font-extrabold text-sm text-white flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-red-600 to-amber-500 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-store text-white text-xs"></i>
            </div>
            <span id="header-title" class="text-base">Plataforma SaaS</span>
        </div>
        <div id="header-nav" class="flex items-center gap-5 text-xs font-bold text-slate-400">
            <!-- Dinâmico -->
        </div>
    </header>

    <!-- 1. VISÃO DO CLIENTE (Aparece se houver ?store= na URL) -->
    <div id="view-store" class="w-full hidden">
        <div id="store-banner" class="w-full h-56 md:h-72 bg-slate-800 bg-cover bg-center relative">
            <div class="absolute inset-0 bg-gradient-to-t from-[#020617] via-[#020617]/60 to-transparent"></div>
        </div>
        <div class="max-w-5xl mx-auto px-4 md:px-8 relative -mt-20">
            <div class="flex flex-col md:flex-row md:items-end gap-5 mb-8">
                <img id="store-logo-img" src="" class="w-28 h-28 md:w-36 md:h-36 rounded-3xl border-4 border-[#020617] shadow-2xl object-cover bg-slate-900 shrink-0">
                <div class="pb-2">
                    <h1 id="store-title" class="text-3xl md:text-5xl font-extrabold text-white mb-2">Carregando...</h1>
                    <span id="store-hours" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900/80 border border-slate-800 text-xs font-bold text-amber-400"><i class="fa-solid fa-clock"></i> <span></span></span>
                </div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5" id="products-container"></div>
        </div>
    </div>

    <!-- 2. TELA DE LOGIN / GESTÃO (Aparece se o link NÃO tiver ?store=) -->
    <div id="view-admin-area" class="max-w-4xl mx-auto px-4 py-16">
        
        <!-- Caixa de Login -->
        <div id="box-login" class="max-w-md mx-auto text-center">
            <div class="glass-card p-8 rounded-3xl shadow-2xl border border-slate-800">
                <div class="w-16 h-16 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl border border-amber-500/20">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 class="text-2xl font-black text-white mb-2">Área Administrativa</h2>
                <p class="text-xs text-slate-400 mb-6">Insira os seus dados de Dono do Sistema.</p>
                <div class="space-y-4 text-left">
                    <input type="email" id="login-email" placeholder="E-mail" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-white outline-none focus:border-amber-500">
                    <input type="password" id="login-senha" placeholder="Senha" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-white outline-none focus:border-amber-500">
                    <button onclick="fazerLoginGlobal()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-xl shadow-lg transition">
                        Entrar no Painel
                    </button>
                </div>
            </div>
        </div>

        <!-- Painel Master (Dono do Sistema) -->
        <div id="box-master-panel" class="hidden space-y-6">
            <div class="glass-card p-6 md:p-8 rounded-3xl flex justify-between items-center">
                <div>
                    <span class="bg-blue-500/10 text-blue-400 text-xs font-black px-3 py-1.5 rounded-full uppercase">Painel do Dono (Master)</span>
                    <h1 class="text-2xl font-extrabold text-white mt-2">Gestão Global do SaaS</h1>
                </div>
                <button onclick="logoutSistema()" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition">Sair</button>
            </div>
            
            <!-- Criar Loja -->
            <div class="glass-card p-6 md:p-8 rounded-3xl space-y-4">
                <h3 class="font-bold text-white text-lg">Criar Nova Loja / Cliente</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="m-id" placeholder="ID da Loja (ex: pizzaria-milan)" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none">
                    <input type="text" id="m-name" placeholder="Nome do Estabelecimento" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none">
                    <input type="email" id="m-email" placeholder="E-mail do Lojista" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none">
                    <input type="text" id="m-pass" placeholder="Senha do Lojista" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none">
                    <input type="text" id="m-phone" placeholder="WhatsApp (5511...)" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none">
                    <input type="text" id="m-logo" placeholder="Link Direto da Logo (URL)" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white outline-none">
                </div>
                <button onclick="criarLojaMaster()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-lg">Salvar e Criar Loja</button>
            </div>

            <!-- Lista de Lojas com Acesso Direto para Você -->
            <div class="glass-card p-6 md:p-8 rounded-3xl">
                <h3 class="font-bold text-white text-lg mb-2">Acesso Direto aos Sites das Lojas</h3>
                <p class="text-xs text-slate-400 mb-6">Aqui tem o acesso instantâneo para abrir ou copiar o link de qualquer loja criada.</p>
                <div id="master-lista-lojas" class="space-y-3"></div>
            </div>
        </div>

    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWzFIaSbT-au2oz7_bEgxGsABi5TjDrig",
            authDomain: "cardapio-5fd4a.firebaseapp.com",
            projectId: "cardapio-5fd4a",
            storageBucket: "cardapio-5fd4a.firebasestorage.app",
            messagingSenderId: "774670757984",
            appId: "1:774670757984:web:fc395973740044ab079305"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const MASTER_EMAIL = "matthecarvalho@gmail.com";
        const MASTER_PASS = "Onerepublic";

        let stores = [], products = [];
        const urlParams = new URLSearchParams(window.location.search);
        const storeId = urlParams.get('store');

        window.initAppMaster = async function() {
            try {
                const sSnap = await getDocs(collection(db, "stores"));
                stores = sSnap.docs.map(d => ({ docId: d.id, ...d.data() }));

                const pSnap = await getDocs(collection(db, "products"));
                products = pSnap.docs.map(d => ({ docId: d.id, ...d.data() }));

                if (storeId) {
                    const store = stores.find(s => s.id === storeId);
                    if (!store) {
                        document.body.innerHTML = `<div class="min-h-screen flex items-center justify-center text-white text-lg">Loja não encontrada.</div>`;
                        return;
                    }
                    document.getElementById('view-store').style.display = 'block';
                    document.getElementById('view-admin-area').style.display = 'none';
                    document.getElementById('header-title').innerText = store.name;
                    document.getElementById('store-title').innerText = store.name;
                    document.getElementById('store-logo-img').src = store.logo;
                    document.getElementById('store-banner').style.backgroundImage = `url('${store.cover}')`;
                    
                    const storeProds = products.filter(p => p.storeId === store.id);
                    document.getElementById('products-container').innerHTML = storeProds.length ? storeProds.map(p => `
                        <div class="glass-card rounded-2xl p-4 flex gap-4">
                            <div class="flex-1">
                                <h3 class="font-bold text-white mb-1">${p.name}</h3>
                                <p class="text-xs text-slate-400 mb-2">${p.desc}</p>
                                <span class="font-black text-green-400">R$ ${p.price.toFixed(2)}</span>
                            </div>
                            <img src="${p.img}" class="w-24 h-24 rounded-xl object-cover">
                        </div>
                    `).join('') : '<p class="text-slate-400">Nenhum produto cadastrado.</p>';
                    return;
                }

                if (localStorage.getItem('saas_master_logged') === 'true') {
                    mostrarPainelMaster();
                }

            } catch (e) {
                console.error(e);
            }
        };

        window.fazerLoginGlobal = function() {
            const email = document.getElementById('login-email').value.trim();
            const senha = document.getElementById('login-senha').value.trim();

            if (email === MASTER_EMAIL && senha === MASTER_PASS) {
                localStorage.setItem('saas_master_logged', 'true');
                mostrarPainelMaster();
            } else {
                alert('E-mail ou senha incorretos!');
            }
        };

        function mostrarPainelMaster() {
            document.getElementById('box-login').style.display = 'none';
            document.getElementById('box-master-panel').style.display = 'block';
            renderizarListaLojasMaster();
        }

        window.logoutSistema = function() {
            localStorage.removeItem('saas_master_logged');
            window.location.reload();
        };

        window.criarLojaMaster = async function() {
            const id = document.getElementById('m-id').value.trim().toLowerCase().replace(/\s+/g, '-');
            const name = document.getElementById('m-name').value;
            const email = document.getElementById('m-email').value;
            const pass = document.getElementById('m-pass').value;
            const phone = document.getElementById('m-phone').value;
            const logo = document.getElementById('m-logo').value || 'https://images.unsplash.com/photo-1590947132387-155cc02f3212?w=200';

            if (!id || !name || !email || !pass) {
                alert('Preencha os campos obrigatórios!');
                return;
            }

            const novaLoja = {
                id, name, email, pass, phone, logo,
                cover: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=1200',
                status: 'active', hours: '18:00 - 23:30', deliveryFee: 5.00
            };

            await addDoc(collection(db, "stores"), novaLoja);
            alert('Loja criada com sucesso!');
            window.location.reload();
        };

        function renderizarListaLojasMaster() {
            const container = document.getElementById('master-lista-lojas');
            container.innerHTML = stores.length ? stores.map(s => {
                const urlLoja = window.location.origin + window.location.pathname.replace('index.html','') + `index.html?store=${s.id}`;
                return `
                    <div class="bg-slate-950 p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-3 text-xs">
                        <div>
                            <strong class="text-white text-sm">${s.name}</strong> 
                            <span class="text-slate-400 block">ID: ${s.id}</span>
                        </div>
                        <div class="flex gap-2">
                            <a href="${urlLoja}" target="_blank" class="bg-green-600 hover:bg-green-700 text-white font-bold px-3 py-2 rounded-lg transition flex items-center gap-1.5">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> Abrir Site
                            </a>
                            <button onclick="navigator.clipboard.writeText('${urlLoja}'); alert('Link copiado!');" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-2 rounded-lg transition">
                                <i class="fa-solid fa-copy"></i> Copiar Link
                            </button>
                        </div>
                    </div>
                `;
            }).join('') : '<p class="text-slate-500 text-sm">Nenhuma loja registada.</p>';
        }

        initAppMaster();
    </script>
</body>
</html>
