<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital SaaS & Gestão Multi-Empresas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #090d16; color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="pb-24">

    <!-- NAVEGAÇÃO SUPERIOR GLOBAL -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-xl flex justify-between items-center">
        <div class="font-extrabold text-sm text-white flex items-center gap-2">
            <i class="fa-solid fa-store text-red-500"></i> <span id="header-store-name">Plataforma SaaS</span>
        </div>
        <div class="flex items-center gap-4 text-xs font-semibold text-slate-300">
            <button onclick="switchView('store')" class="flex flex-col items-center hover:text-red-500 transition"><i class="fa-solid fa-house mb-1 text-base"></i> LOJA</button>
            <button onclick="openCart()" class="flex flex-col items-center hover:text-red-500 transition relative"><i class="fa-solid fa-cart-shopping mb-1 text-base"></i> CARRINHO</button>
            <button onclick="openAccountModal()" class="flex flex-col items-center hover:text-amber-400 transition text-amber-500"><i class="fa-solid fa-user mb-1 text-base"></i> CONTA</button>
        </div>
    </header>

    <!-- ================= 1. VISÃO DO CLIENTE (STOREFRONT) ================= -->
    <div id="view-store" class="max-w-5xl mx-auto px-4 py-6">
        <div id="store-banner" class="relative rounded-3xl overflow-hidden mb-6 h-56 bg-slate-800 shadow-2xl bg-cover bg-center border border-slate-800">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent flex flex-col justify-end p-6 md:p-8">
                <div class="flex items-center gap-5">
                    <img id="store-logo-img" src="" alt="Logo" class="w-20 h-20 rounded-2xl border-2 border-slate-700 shadow-2xl object-cover bg-white">
                    <div>
                        <h1 id="store-title" class="text-3xl md:text-4xl font-extrabold text-white tracking-tight">Carregando...</h1>
                        <p id="store-hours" class="text-slate-300 text-sm mt-1 flex items-center gap-2"><i class="fa-regular fa-clock text-amber-400"></i> <span></span></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Categorias -->
        <div class="flex gap-2.5 overflow-x-auto pb-3 mb-6 scrollbar-hide" id="categories-container"></div>

        <!-- Produtos -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="products-container"></div>
    </div>

    <!-- ================= 2. PAINEL DO EMPRESÁRIO ================= -->
    <div id="view-admin_empresario" class="max-w-6xl mx-auto px-4 py-8 hidden">
        <div class="bg-slate-900/90 backdrop-blur-md p-6 md:p-8 rounded-3xl border border-slate-800 shadow-2xl mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <span class="bg-amber-500/10 text-amber-400 text-xs font-extrabold px-3 py-1 rounded-full border border-amber-500/20 uppercase tracking-wider">Painel Exclusivo do Lojista</span>
                <h1 class="text-3xl font-extrabold text-white mt-2" id="admin-store-name">Minha Loja</h1>
                <p class="text-slate-400 text-sm mt-1">Gerenciamento isolado do seu cardápio, produtos e pedidos em tempo real.</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="setAdminTab('kanban')" id="tab-btn-kanban" class="px-4 py-2.5 rounded-xl text-sm font-bold bg-amber-600 text-white shadow-lg shadow-amber-600/20 transition">Kanban de Pedidos</button>
                <button onclick="setAdminTab('metrics')" id="tab-btn-metrics" class="px-4 py-2.5 rounded-xl text-sm font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Métricas de Vendas</button>
                <button onclick="setAdminTab('catalog')" id="tab-btn-catalog" class="px-4 py-2.5 rounded-xl text-sm font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Produtos & Categorias</button>
                <button onclick="logoutEmpresario()" class="px-4 py-2.5 rounded-xl text-sm font-bold bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 transition">Sair</button>
            </div>
        </div>

        <!-- Kanban -->
        <div id="admin-content-kanban" class="grid grid-cols-1 md:grid-cols-4 gap-5"></div>

        <!-- Métricas -->
        <div id="admin-content-metrics" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div class="bg-slate-900/90 p-6 rounded-2xl border border-slate-800 shadow-xl">
                    <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Faturamento Total</p>
                    <h3 class="text-3xl font-black text-green-400 mt-2" id="metric-revenue">R$ 0,00</h3>
                </div>
                <div class="bg-slate-900/90 p-6 rounded-2xl border border-slate-800 shadow-xl">
                    <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Total de Pedidos</p>
                    <h3 class="text-3xl font-black text-white mt-2" id="metric-orders">0</h3>
                </div>
                <div class="bg-slate-900/90 p-6 rounded-2xl border border-slate-800 shadow-xl">
                    <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Ticket Médio</p>
                    <h3 class="text-3xl font-black text-amber-400 mt-2" id="metric-ticket">R$ 0,00</h3>
                </div>
            </div>
        </div>

        <!-- Produtos & Categorias -->
        <div id="admin-content-catalog" class="hidden space-y-6">
            <div class="bg-slate-900/90 p-6 md:p-8 rounded-3xl border border-slate-800 shadow-2xl">
                <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2"><i class="fa-solid fa-circle-plus text-amber-500"></i> Adicionar Novo Produto ao Cardápio</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="p-name" placeholder="Nome do Prato/Pizza/Bebida" class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-white focus:border-amber-500 outline-none">
                    <select id="p-cat" class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-white focus:border-amber-500 outline-none">
                        <option value="Pizzas">Pizzas</option>
                        <option value="Hambúrgueres">Hambúrgueres</option>
                        <option value="Bebidas">Bebidas</option>
                        <option value="Sobremesas">Sobremesas</option>
                        <option value="📅 Encomendas Agendadas">📅 Encomendas Agendadas</option>
                    </select>
                    <input type="number" step="0.01" id="p-price" placeholder="Preço (R$)" class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-white focus:border-amber-500 outline-none">
                    <input type="text" id="p-img" placeholder="URL da Imagem (Unsplash)" class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-white focus:border-amber-500 outline-none">
                    <textarea id="p-desc" placeholder="Descrição dos ingredientes..." class="md:col-span-2 bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-white focus:border-amber-500 outline-none" rows="2"></textarea>
                    <button onclick="addNewProduct()" class="md:col-span-2 bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-amber-600/20">Cadastrar Produto</button>
                </div>
            </div>

            <div class="bg-slate-900/90 p-6 md:p-8 rounded-3xl border border-slate-800 shadow-2xl">
                <h3 class="text-xl font-bold text-white mb-6">Produtos Atuais da Loja</h3>
                <div id="admin-products-list" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- ================= 3. MASTER ADMIN (MATTHECARVALHO@GMAIL.COM) ================= -->
    <div id="view-admin_master" class="max-w-6xl mx-auto px-4 py-8 hidden">
        <div class="bg-slate-900/90 backdrop-
